<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PURESPACE</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #ffffff;
            color: #1a1a1a;
            text-align: center;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.1rem;
            letter-spacing: -0.02em;
        }
        p {
            font-size: 1.7rem;
            color: #666;
            max-width: 1000px;
            line-height: 1.5;
            margin-bottom: 2rem;
        }
        .button-container {
            display: flex;
            gap: 17px;
        }
        .link-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #363636;
            color: #ffffff;
            text-decoration: none;
            padding: 10px 0; 
            width: 100px;
            line-height: 1;
            border-radius: 50px;
            font-size: 1rem;
            transition: background-color 0.2s ease;
        }
        .link-button:hover {
            background-color: #000000;
        }
        .icon {
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <h1>PURESPACE</h1>
    <p>A Benchmark for Abstract Spatial Reasoning in Vision-Language Models</p>
    
    <div class="button-container">
        <a href="https://github.com/canglanx/purespace" class="link-button">
            <span class="icon"><i class="fab fa-github"></i></span>
            <span>Code</span>
        </a>
        <a href="https://huggingface.co/datasets/canglanx/purespace" class="link-button">
            <span class="icon"><i class="fas fa-database"></i></span>
            <span>Data</span>
        </a>
    </div>
</body>
</html>
